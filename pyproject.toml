[project]
name = "code-suggester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hn-minh", email = "nminh792004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.3.0",
    "datasketch>=2.0.0",
    "matplotlib>=3.11.2",
    "openai>=3.14.1",
    "pandas>=3.0.5",
    "pyflakes>=4.0.0",
    "python-dotenv>=1.2.3",
    "pyyml>=0.0.2",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "torch>=2.12.1",
    "tqdm>=4.70.1",
    "transformers>=5.5.0",
    "unsloth>=2026.9.7",
    "wandb>=0.30.0",
]

[project.scripts]
code-suggester = "code_suggester:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
]
